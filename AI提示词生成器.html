<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI提示词生成器</title>
  <style>
    :root{
      --bg: #0f1226;
      --bg2: #101427;
      --card: rgba(255,255,255,0.07);
      --card-strong: rgba(255,255,255,0.12);
      --text: #e8eaf2;
      --muted: #a7acc0;
      --primary: #6dd5fa;
      --primary-2: #3a7bd5;
      --success: #34d399;
      --warn: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --radius: 14px;
      /* Scrollbar theme */
      --scrollbar-size: 10px;
      --scrollbar-track: transparent;
      --scrollbar-thumb: rgba(255,255,255,0.35);
      --scrollbar-thumb-hover: rgba(255,255,255,0.50);
      --scrollbar-thumb-active: rgba(255,255,255,0.65);
    }
    *{box-sizing:border-box}
    /* Ensure background covers full page without seams */
    html,body{min-height:100%}
    body{
      margin:0; color:var(--text); background: radial-gradient(1200px 600px at 20% -10%, #1e2344, transparent),
      radial-gradient(900px 500px at 100% 0%, #202750, transparent), linear-gradient(180deg, var(--bg), var(--bg2));
      /* Prevent any perceived banding by keeping layers pinned and non-repeating */
      background-attachment: scroll, scroll, scroll;
      background-repeat: no-repeat, no-repeat, no-repeat;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    /* Vertical layout improvements */
    .app{max-width: 980px; margin: 48px auto; padding: 0 20px; display:flex; flex-direction:column; gap:16px}
    header{
      display:flex; align-items:center; justify-content:space-between; margin: 0;
    }
    .brand{display:flex; gap:12px; align-items:center}
    .logo{width:44px; height:44px; display:block; color: var(--primary)}
    /* gear icon uses currentColor */
    .logo path{fill: currentColor}
    h1{font-size:20px; margin:0}
    .muted{color:var(--muted)}

    .card{background: var(--card); border:1px solid rgba(255,255,255,0.08); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: saturate(140%) blur(10px)}

    .composer{padding:16px; display:grid; gap:12px; position:relative; z-index:1000; overflow:visible;}
    .row{display:flex; gap:12px; align-items:center}
    textarea{
      width:100%; min-height:72px; resize: vertical; border-radius: 10px; border:1px solid rgba(255,255,255,0.15);
      padding:12px 12px 28px; color:var(--text); background: rgba(255,255,255,0.04); outline:none; transition:.15s border-color;
    }
    /* Increase spacing below the main input by 5px */
    #text { margin-bottom: 5px; }
    textarea:focus{border-color: var(--primary)}
    .meta{display:flex; justify-content:space-between; align-items:center; margin-top:-8px; padding:0}
    .counter{font-size:12px; color:var(--muted)}

    select, input[type="text"]{
      height:40px; padding:0 12px; border-radius: 10px; border:1px solid rgba(255,255,255,0.15);
      color:var(--text); background: rgba(255,255,255,0.04); outline:none; transition:.15s border-color;
    }
    select:focus, input[type="text"]:focus{border-color: var(--primary)}

    .btn{height:40px; padding:0 14px; border-radius: 10px; border:1px solid rgba(255,255,255,0.1); color:#0b1220; background: linear-gradient(135deg, var(--primary), var(--primary-2)); font-weight:600; cursor:pointer; box-shadow: var(--shadow);}
    .btn[disabled]{opacity:.6; cursor:not-allowed}
    .btn.ghost{background: transparent; color: var(--text)}

    .toolbar{margin:0; padding:10px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .spacer{flex:1}
    .stat{font-size:12px; color:var(--muted)}

    .list{margin:0; display:grid; gap:10px}
    .item{display:grid; grid-template-columns:auto max-content; gap:10px; padding:12px; border-radius: 12px; border:1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04)}
    .item.done{opacity:.7}
    .item .content{white-space:normal; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
    .chip{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 8px; border-radius:999px; font-size:12px; border:1px solid rgba(255,255,255,0.12)}
    .chip.low{color:#7dd3fc; background: rgba(125,211,252,0.1)}
    .chip.medium{color:#fbbf24; background: rgba(251,191,36,0.08)}
    .chip.high{color:#f87171; background: rgba(248,113,113,0.08)}

    /* files sublist */
    .files{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px}
    .files .file-input{height:28px; padding:0 8px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); color:var(--text); background: rgba(255,255,255,0.04); outline:none}
    .files .file-input:focus{border-color: var(--primary)}
    .chip.file{height:22px; padding:0 6px; border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.05)}
    .chip.file .remove-file{margin-left:6px; width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; line-height:1; font-size:12px; text-align:center; border-radius:50%; border:1px solid rgba(255,255,255,0.2); background: transparent; color: var(--muted); cursor:pointer}
    .chip.file .remove-file:hover{color: var(--text); border-color: rgba(255,255,255,0.35)}

    .actions{display:flex; align-items:center; gap:6px}
    .icon-btn{height:36px; width:36px; display:grid; place-items:center; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); color:var(--text); cursor:pointer}
    .icon-btn:hover{background: rgba(255,255,255,0.06)}
    .icon{width:18px; height:18px; display:block}

    .search{min-width:220px}
    .empty{padding:24px; text-align:center; color:var(--muted)}

    @media (max-width: 680px){
      .row{flex-direction:column; align-items:stretch}
      .spacer{display:none}
    }
    /* dropdown blur enhancement */
    .dropdown-menu{
      background: #101427;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .dropdown-menu [role="option"]:hover{ background: rgba(255,255,255,0.12); }
    /* preview layout */
    .main{ display:grid; grid-template-columns: 1fr 380px; gap:16px; align-items:start; margin-top:0; min-height:0; }
    .left-col{ min-width:0 }
    .preview{ padding:12px; position:sticky; top:16px }
    .preview-header{ font-weight:600; margin-bottom:8px; color:var(--muted) }
    .preview-body{ margin:0; max-height: 50vh; overflow:auto; padding:12px; border-radius:10px; background: rgba(0,0,0,0.18); border:1px solid rgba(255,255,255,0.08); color:var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size:12px; line-height:1.6 }
    .preview-actions{ display:flex; justify-content:flex-end; margin-top:10px }
    @media (max-width: 980px){ .main{ grid-template-columns: 1fr } .preview{ position:static } }
    @media (min-width: 1200px){
      .app{ max-width: 1280px; }
      .main{ grid-template-columns: 1.15fr 420px; gap:20px }
      .preview{ top:20px }
      .preview-body{ max-height: 60vh }
    }

    /* Scrollbar: consistent, contrast-safe, no layout shift */
    html{
      overflow-y: auto;
      /* Hint UAs to render dark UI (affects native scrollbars in some browsers) */
      color-scheme: dark;
    }
    html, body{ overflow-x:hidden; }
    /* Firefox */
    html, body, textarea, .preview-body{
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }
    /* WebKit-based browsers (Chrome/Edge/Safari) */
    ::-webkit-scrollbar{ width: var(--scrollbar-size); height: var(--scrollbar-size); }
    ::-webkit-scrollbar-track{ background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb{
      border-radius: 999px;
      /* Use background-clip + transparent border for visually thinner pill */
      background-clip: padding-box;
      border: 3px solid transparent;
      background-color: var(--scrollbar-thumb);
      box-shadow: 0 8px 20px rgba(0,0,0,0.30), inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    ::-webkit-scrollbar-thumb:hover{ background-color: var(--scrollbar-thumb-hover); }
    ::-webkit-scrollbar-thumb:active{ background-color: var(--scrollbar-thumb-active); }
    ::-webkit-scrollbar-corner{ background: transparent; }
    /* High contrast/forced colors: fall back to system defaults for accessibility */
    @media (forced-colors: active){
      *{ scrollbar-color: auto !important; }
      ::-webkit-scrollbar, ::-webkit-scrollbar-thumb, ::-webkit-scrollbar-track{ all: revert; }
    }
  /* drag and drop visuals */
  .item.dragging{opacity:.5}
  .item.drop-before{box-shadow: inset 0 2px 0 0 var(--primary)}
  .item.drop-after{box-shadow: inset 0 -2px 0 0 var(--primary)}
  .item[draggable="true"]{cursor:grab}
  .item[draggable="true"]:active{cursor:grabbing}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <svg class="logo" viewBox="0 0 1024 1024" aria-label="设置" role="img">
          <path d="M383.653333 961.18a52.986667 52.986667 0 0 1-16.353333-2.586667 467.833333 467.833333 0 0 1-68.353333-28.3c-24.76-12.666667-35.713333-42.513333-24.92-68a85.333333 85.333333 0 0 0-112-111.84 52.36 52.36 0 0 1-20.5 4.166667 53.48 53.48 0 0 1-47.54-29A467.393333 467.393333 0 0 1 65.6 657.333333c-8.613333-26.48 4.753333-55.38 30.433333-65.786666a85.333333 85.333333 0 0 0-0.14-158.286667C70.2 422.866667 56.78 394 65.333333 367.5a467.726667 467.726667 0 0 1 28.286667-68.413333 52.886667 52.886667 0 0 1 29.333333-25.82 53.446667 53.446667 0 0 1 38.893334 1.013333 84.973333 84.973333 0 0 0 33.02 6.62 85.333333 85.333333 0 0 0 78.533333-118.753333c-10.833333-25.48 0.06-55.373333 24.8-68.053334a467.12 467.12 0 0 1 68.333333-28.44c26.46-8.62 55.333333 4.726667 65.753334 30.393334A85.04 85.04 0 0 0 511.4 149.333333h0.14a85.013333 85.013333 0 0 0 79.046667-53.473333c10.346667-25.7 39.213333-39.133333 65.713333-30.58A467.686667 467.686667 0 0 1 724.666667 93.513333c24.773333 12.613333 35.746667 42.48 24.98 68A85.386667 85.386667 0 0 0 861.54 273.333333a53.333333 53.333333 0 0 1 68.246667 24.626667 468.593333 468.593333 0 0 1 28.486666 68.34c8.666667 26.473333-4.706667 55.38-30.373333 65.813333A84.993333 84.993333 0 0 0 874.666667 511.333333v0.666667a85.006667 85.006667 0 0 0 53.333333 79.146667c25.693333 10.38 39.086667 39.266667 30.493333 65.753333a468 468 0 0 1-28.326666 68.333333c-12.666667 24.76-42.526667 35.693333-68 24.893334a85.013333 85.013333 0 0 0-93.4 18l-0.28 0.28a85.006667 85.006667 0 0 0-18.213334 93.68c10.813333 25.493333-0.106667 55.373333-24.86 68.033333a468.153333 468.153333 0 0 1-68.326666 28.366667c-26.486667 8.606667-55.373333-4.78-65.766667-30.466667a85.02 85.02 0 0 0-79.133333-53.333333h-0.04a85.006667 85.006667 0 0 0-79.12 53.406666c-8.24 20.42-28.213333 33.086667-49.373334 33.086667zM195.333333 700.986667a129.133333 129.133333 0 0 1 23.466667 2.153333A128.033333 128.033333 0 0 1 313.333333 878.913333a10.513333 10.513333 0 0 0 5.02 13.37         </svg>
        <div>
          <h1>AI提示词生成器</h1>
          <div class="muted">逐条录入、整理与导出你的产品/开发需求</div>
        </div>
      </div>
      <div class="stat" id="stats">0 项需求</div>
    </header>

    <section class="card composer" aria-label="新增需求">
      <textarea id="text" placeholder="填写清晰、可执行的需求描述。支持多行。Ctrl/⌘+Enter 快速添加。" data-testid="input"></textarea>
      <div class="meta">
        <div class="row" style="gap:8px">
          <select id="priority" aria-label="优先级">
            <option value="medium">优先级：中</option>
            <option value="high">优先级：高</option>
            <option value="low">优先级：低</option>
          </select>
          <input id="tag" class="search" type="text" placeholder="标签（可选，如：UI、API）" />
        </div>
        <div class="row" style="gap:8px">
          <span class="counter" id="counter">0 字</span>
          <button class="btn" id="add">添加需求</button>
        </div>
      </div>
    </section>

    <section class="card toolbar">
      <input id="q" class="search" type="text" placeholder="搜索（内容/标签）" />
      <div class="spacer"></div>
            <button class="btn ghost" id="exportMd">导出 Markdown</button>
      <button class="btn ghost" id="copyMd">复制 Markdown</button>
                  <button class="btn ghost" id="clearDone">清除已完成</button>
    </section>

    <section class="main">
      <div class="left-col">
        <section class="list" id="list" aria-live="polite"></section>
        <div class="empty" id="empty">暂无需求，先在上方输入并点击“添加需求”。</div>
      </div>
      <section class="card preview" id="preview">
        <div class="preview-header">Markdown 预览</div>
        <pre id="mdPreview" class="preview-body" aria-label="Markdown 预览内容"></pre>
        <div class="preview-actions">
          <button class="btn ghost" id="copyPreview">复制预览</button>
        </div>
      </section>
    </section>
  </div>

  <template id="tpl">
    <article class="item" data-id="" draggable="true">
      <div>
        <div class="row" style="justify-content:space-between">
          <div class="row" style="gap:8px">
            <span class="chip medium" data-chip></span>
            <span class="chip" data-tags></span>
          </div>
          <label class="row" style="gap:6px; font-size:13px; color:var(--muted)"><input type="checkbox" data-done /> 完成</label>
        </div>
        <div class="content" data-content style="margin-top:8px"></div>
        <div class="files" data-files>
          <div class="files-list" data-files-list></div>
          <input class="file-input" type="text" data-file-input placeholder="涉及文件：回车添加" />
        </div>
      </div>
      <div class="actions">
        <button class="icon-btn" title="置顶" data-top>&#9195;</button>
        <button class="icon-btn" title="置底" data-bottom>&#9196;</button>
        <button class="icon-btn" title="编辑" data-edit>
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"/></svg>
        </button>
        <button class="icon-btn" title="删除" data-del>
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 7h12v2H6zm2 3h8l-1 9H9L8 10zM9 4h6v2H9z"/></svg>
        </button>
      </div>
    </article>
  </template>

  <script>
    const $ = (s, el=document) => el.querySelector(s);
    const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));

    const storageKey = 'requirements:v1';
    const state = { items: [] };

    function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

    function load(){
      try{
        const raw = localStorage.getItem(storageKey);
        state.items = raw ? JSON.parse(raw) : [];
      }catch(e){
        console.warn('读取本地数据失败', e); state.items = [];
      }
    }
    function save(){
      localStorage.setItem(storageKey, JSON.stringify(state.items));
    }

    function stats(){
      const total = state.items.length;
      const done = state.items.filter(i=>i.done).length;
      $('#stats').textContent = `${total} 项需求 · 已完成 ${done}`;
    }

    function chipText(p){
      return p==='high' ? '高优先级' : p==='low' ? '低优先级' : '中优先级';
    }

    function render(){
      const q = $('#q').value.trim().toLowerCase();
      const list = $('#list');
      list.innerHTML = '';
      const filtered = state.items.filter(i => {
        if(!q) return true;
        const inText = i.text.toLowerCase().includes(q);
        const inTag = (i.tag||'').toLowerCase().includes(q);
        const inFiles = (i.files||[]).some(f => String(f||'').toLowerCase().includes(q));
        return inText || inTag || inFiles;
      });
      $('#empty').style.display = filtered.length ? 'none' : 'block';
      filtered.forEach((item, idx) => {
        const tpl = $('#tpl').content.cloneNode(true);
        const el = tpl.querySelector('.item');
        el.dataset.id = item.id;
        if(item.done) el.classList.add('done');
        const chip = tpl.querySelector('[data-chip]');
        chip.textContent = chipText(item.priority);
        chip.classList.remove('low','medium','high');
        chip.classList.add(item.priority);
        const tag = tpl.querySelector('[data-tags]');
        tag.textContent = item.tag ? `#${item.tag}` : '#未标记';
        const content = tpl.querySelector('[data-content]');
        content.textContent = item.text;
        content.title = '双击编辑';
        // files sublist render
        item.files = Array.isArray(item.files) ? item.files : [];
        const filesList = tpl.querySelector('[data-files-list]');
        const fileInput = tpl.querySelector('[data-file-input]');
        if(filesList){
          filesList.innerHTML = '';
          item.files.forEach((f) => {
            const chip = document.createElement('span');
            chip.className = 'chip file';
            chip.title = f;
            chip.textContent = f;
            const rm = document.createElement('button');
            rm.type = 'button';
            rm.className = 'remove-file';
            rm.textContent = '×';
            rm.title = '移除';
            rm.addEventListener('click', () => {
              item.files = (item.files||[]).filter(x => x !== f);
              save(); render();
            });
            chip.appendChild(rm);
            filesList.appendChild(chip);
          });
        }
        if(fileInput){
          fileInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter'){
              e.preventDefault();
              const v = fileInput.value.trim();
              if(!v) return;
              item.files = item.files || [];
              if(!item.files.includes(v)) item.files.push(v);
              fileInput.value = '';
              save(); render();
            }
          });
        }
        const done = tpl.querySelector('[data-done]');
        done.checked = !!item.done;
        done.addEventListener('change', () => { item.done = done.checked; save(); render(); });
        tpl.querySelector('[data-edit]').addEventListener('click', () => editItem(item.id));
        content.addEventListener('dblclick', () => editItem(item.id));
        tpl.querySelector('[data-del]').addEventListener('click', () => delItem(item.id));
        
        const topBtn = tpl.querySelector('[data-top]');
        if(topBtn) topBtn.addEventListener('click', () => moveTo(item.id, 0));
        const bottomBtn = tpl.querySelector('[data-bottom]');
        if(bottomBtn) bottomBtn.addEventListener('click', () => moveTo(item.id, state.items.length - 1));
        list.appendChild(tpl);
      });
      stats();
      updatePreview();
    }

    function add(){
      const text = $('#text').value.trim();
      if(!text) return;
      const priority = getPriority();
      const tag = $('#tag').value.trim();
      state.items.push({ id: uid(), text, priority, tag, createdAt: Date.now(), done:false, files: [] });
      $('#text').value = '';
      $('#tag').value = '';
      updateCounter();
      save();
      render();
      $('#text').focus();
    }

    function delItem(id){
      state.items = state.items.filter(i => i.id !== id);
